<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即時到站時間表 - 朗屏站 / K66 / B1</title>
<style>
:root {
--mtr-purple: #5c2d91;
--kmb-red: #d9232e;
--mtr-bus-blue: #0072ce;
--bg-color: #f4f6f9;
--card-bg: #ffffff;
--text-main: #333333;
--text-sub: #666666;
}

body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
background-color: var(--bg-color);
color: var(--text-main);
margin: 0;
padding: 15px;
}

.container {
max-width: 600px;
margin: 0 auto;
}

header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 15px;
padding: 0 5px;
}

h1 {
font-size: 1.4rem;
margin: 0;
color: #1a1a1a;
}

.refresh-btn {
background-color: #007aff;
color: white;
border: none;
padding: 8px 14px;
border-radius: 20px;
font-size: 0.85rem;
cursor: pointer;
transition: background-color 0.2s;
}

.refresh-btn:hover {
background-color: #0056b3;
}

.card {
background: var(--card-bg);
border-radius: 12px;
padding: 16px;
margin-bottom: 16px;
box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.card-header {
display: flex;
align-items: center;
border-bottom: 2px solid #f0f0f0;
padding-bottom: 10px;
margin-bottom: 12px;
}

.badge {
color: white;
padding: 4px 10px;
border-radius: 6px;
font-weight: bold;
font-size: 0.9rem;
margin-right: 10px;
white-space: nowrap;
}

.badge-mtr { background-color: var(--mtr-purple); }
.badge-mtr-bus { background-color: var(--mtr-bus-blue); }
.badge-kmb { background-color: var(--kmb-red); }

.station-name {
font-size: 1.1rem;
font-weight: bold;
}

.route-direction {
font-size: 0.85rem;
color: var(--text-sub);
margin-top: 2px;
}

.eta-list {
display: flex;
flex-direction: column;
gap: 10px;
}

.eta-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 12px;
background-color: #f8f9fa;
border-radius: 8px;
}

.destination {
font-size: 1rem;
font-weight: 500;
}

.eta-time-group {
text-align: right;
}

.minutes {
font-size: 1.2rem;
font-weight: bold;
color: #d9232e;
}

.clock-time {
font-size: 0.75rem;
color: var(--text-sub);
}

.loading, .error {
text-align: center;
padding: 15px;
color: var(--text-sub);
font-size: 0.9rem;
}

.error { color: var(--kmb-red); }

.footer-info {
text-align: center;
font-size: 0.75rem;
color: var(--text-sub);
margin-top: 20px;
}
</style>
</head>
<body>

<div class="container">
<header>
<h1>即時交通到站時間</h1>
<button class="refresh-btn" onclick="fetchAllETA()">🔄 手動更新</button>
</header>

<!-- 1. 港鐵 屯馬綫 朗屏站 -->
<div class="card">
<div class="card-header">
<span class="badge badge-mtr">屯馬綫</span>
<div>
<div class="station-name">朗屏站 (Long Ping Station)</div>
<div class="route-direction">港鐵即時列車班次</div>
</div>
</div>
<div id="mtr-eta" class="loading">正在載入數據...</div>
</div>

<!-- 2. 港鐵巴士 K66 屏昌徑 -->
<div class="card">
<div class="card-header">
<span class="badge badge-mtr-bus">港鐵巴士 K66</span>
<div>
<div class="station-name">屏昌徑 (Ping Cheong Path)</div>
<div class="route-direction">往 朗屏 / 大棠</div>
</div>
</div>
<div id="k66-eta" class="loading">正在載入數據...</div>
</div>

<!-- 3. 九巴 B1 元朗廣場 -->
<div class="card">
<div class="card-header">
<span class="badge badge-kmb">九巴 B1</span>
<div>
<div class="station-name">元朗廣場 (Yuen Long Plaza)</div>
<div class="route-direction">往 天水圍天慈邨 / 落馬洲站</div>
</div>
</div>
<div id="b1-eta" class="loading">正在載入數據...</div>
</div>

<div class="footer-info">
數據來源：香港政府資料一線通 (Data.gov.hk)<br>
系統每 30 秒自動更新一次
</div>
</div>

<script>
// 計算分鐘數
function getMinutesDiff(targetTimeStr) {
if (!targetTimeStr) return '--';
const now = new Date();
const target = new Date(targetTimeStr);
const diffMs = target - now;
const diffMins = Math.round(diffMs / 60000);
if (diffMins <= 0) return '即將到達';
return ${diffMins} 分鐘`;
}

// 格式化時間 (HH:MM)
function formatClockTime(timeStr) {
if (!timeStr) return '';
const date = new Date(timeStr);
const hours = String(date.getHours()).padStart(2, '0');
const minutes = String(date.getMinutes()).padStart(2, '0');
return ``${hours}:${minutes};
}

// 1. 港鐵朗屏站 (LOP)
async function fetchMTR() {
const container = document.getElementById('mtr-eta');
try {
const response = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=LOP');
const data = await response.json();

if (data.status === 0 || !data.data || !data.data['TML-LOP']) {
container.innerHTML = <div class="error"&gt;${data.message || '暫無列車數據'}</div>`;
return;
}

const lopData = data.data['TML-LOP'];
let html = '<div class="eta-list">';

// 往屯門 (TUM)
if (lopData.DOWN && lopData.DOWN.length > 0) {
lopData.DOWN.slice(0, 2).forEach(train => {
html += &lt;div class="eta-item"&gt; &lt;div class="destination"&gt;往 屯門&lt;/div&gt; &lt;div class="eta-time-group"&gt; &lt;div class="minutes"&gt;${getMinutesDiff(train.ttnt)}</div>
<div class="clock-time">預計 ${formatClockTime(train.ttnt)} (月台 ${train.plat})</div>
</div>
</div>; }); } else { html +=<div class="eta-item"><div class="destination">往 屯門</div><div>暫無班次</div></div>`;
}

// 往烏溪沙 (WKS)
if (lopData.UP && lopData.UP.length > 0) {
lopData.UP.slice(0, 2).forEach(train => {
html += &lt;div class="eta-item"&gt; &lt;div class="destination"&gt;往 烏溪沙&lt;/div&gt; &lt;div class="eta-time-group"&gt; &lt;div class="minutes"&gt;${getMinutesDiff(train.ttnt)}</div>
<div class="clock-time">預計 {train.plat})</div>
</div>
</div>; }); } else { html +=<div class="eta-item"><div class="destination">往 烏溪沙</div><div>暫無班次</div></div>`;
}

html += '</div>';
container.innerHTML = html;
} catch (err) {
container.innerHTML = <div class="error"&gt;獲取港鐵數據失敗，請確保使用網頁伺服器開啟&lt;/div>;
}
}

// 2. 港鐵巴士 K66 (屏昌徑) - 使用 CORS Proxy 解決跨域問題
async function fetchK66() {
const container = document.getElementById('k66-eta');
try {
const targetApi = 'https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule';
const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetApi);

const response = await fetch(proxyUrl, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ routeName: "K66" })
});
const data = await response.json();

if (!data.busStop) {
container.innerHTML = <div class="error"&gt;暫無巴士數據&lt;/div>;
return;
}

const targetStops = data.busStop.filter(s => s.busStopSubNameTc && s.busStopSubNameTc.includes('屏昌徑'));

if (targetStops.length === 0) {
container.innerHTML = <div class="error"&gt;未找到屏昌徑站點數據&lt;/div>;
return;
}

let html = '<div class="eta-list">';
targetStops.forEach(stop => {
const etas = stop.bus ? stop.bus.filter(b => b.departureTimeInSecond > 0) : [];
const dest = stop.busStopRemarkTc || (stop.busStopId.includes('U') ? '往 大棠' : '往 朗屏');

if (etas.length > 0) {
etas.slice(0, 2).forEach(bus => {
const mins = Math.ceil(bus.departureTimeInSecond / 60);
const minText = mins <= 1 ? '即將到達' : ${mins} 分鐘; html +=
<div class="eta-item">
<div class="destination">${dest}&lt;/div&gt; &lt;div class="eta-time-group"&gt; &lt;div class="minutes"&gt;${minText}</div>
<div class="clock-time">${bus.departureTimeText || ''}&lt;/div&gt; &lt;/div&gt; &lt;/div>;
});
} else {
html += &lt;div class="eta-item"&gt; &lt;div class="destination"&gt;${dest}</div>
<div class="clock-time">未有即時班次</div>
</div>; } }); html += '&lt;/div&gt;'; container.innerHTML = html; } catch (err) { container.innerHTML =<div class="error">獲取 K66 數據失敗</div>`;
}
}

// 3. 九巴 B1 (元朗廣場)
async function fetchB1() {
const container = document.getElementById('b1-eta');
const stopId = "E4072848981A78B8";

try {
const response = await fetch(https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
const data = await response.json();

if (!data.data) {
container.innerHTML = <div class="error"&gt;暫無九巴數據&lt;/div>;
return;
}

const b1Etas = data.data.filter(item => item.route === 'B1');

if (b1Etas.length === 0) {
container.innerHTML = <div class="error"&gt;目前沒有 B1 班次資料&lt;/div>;
return;
}

const inbound = b1Etas.filter(item => item.dir === 'I' && item.eta).slice(0, 2);
const outbound = b1Etas.filter(item => item.dir === 'O' && item.eta).slice(0, 2);

let html = '<div class="eta-list">';

const renderBusList = (list) => {
list.forEach(bus => {
html += &lt;div class="eta-item"&gt; &lt;div class="destination"&gt;往 ${bus.dest_tc}</div>
<div class="eta-time-group">
<div class="minutes">${getMinutesDiff(bus.eta)}&lt;/div&gt; &lt;div class="clock-time"&gt;預計 ${formatClockTime(bus.eta)}&lt;/div&gt; &lt;/div&gt; &lt;/div>;
});
};

if (outbound.length > 0) renderBusList(outbound);
if (inbound.length > 0) renderBusList(inbound);

if (outbound.length === 0 && inbound.length === 0) {
html += <div class="loading"&gt;現時沒有即將到達的 B1 班次&lt;/div>;
}

html += '</div>';
container.innerHTML = html;
} catch (err) {
container.innerHTML = <div class="error"&gt;獲取九巴數據失敗&lt;/div>;
}
}

// 更新全部
function fetchAllETA() {
fetchMTR();
fetchK66();
fetchB1();
}

// 頁面載入後自動執行並每 30 秒更新
window.onload = () => {
fetchAllETA();
setInterval(fetchAllETA, 30000);
};
</script>

</body>
</html>
